[[keep.rule]]
type = "tests"
include = ["tests/**"]
support = ["tests/support/**"]
support_reason = "test support"
reason = "test of retained modules"
excluded_imports = ["pp_"]   # the archive namespaces, which are not kept

[cut]
out_dir = "out/cut"
keep = "out/keep.tsv"
tree = "scratch/cut"
commit = true
message = """Minimal tree of {repo}@{pin}

Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"""
# The pin trips the global gitleaks hook on known false positives (a public tokenizer digest,
# model_key names). This scratch tree is never pushed; the handover repo carries a narrow
# .gitleaks.toml and .gitleaksignore instead.
commit_env = { SKIP_SECRET_SCAN = "1" }

[audit]
out_dir = "out/audit-cut"
repo = "scratch/cut"
keep = "out/keep.tsv"
reasons = []

[triage]
out_dir = "out/triage"
tree = "scratch/triage-new"
drops = "triage-drops.tsv"          # the original triage, in this skill's formats
retargets = "triage-retargets.toml"

[rename]
out_dir = "out/rename"
repo = "scratch/renamed"        # a clone of the triaged cut; never the source
map = "rename-map.toml"   # an example: stages 1-3 in part, not the full Training Effects renames
missing = "error"
# Model-visible text: prompts, vendored trainers, reading, answer keys, fixtures. Both layouts.
frozen = [
  "src/propensity_prediction/prompts/**", "src/training_effects/prompts/**",
  "src/propensity_prediction/training/_vendor/**", "src/training_effects/training/_vendor/**",
  "benchmarks/shared/reading/**", "benchmarks/shared/checkpoints/**",
  "benchmarks/*/ground-truth/**", "benchmarks/shared/ground-truth/**",
  "tests/support/fixtures/**", "uv.lock", "LICENSE",
]
unfrozen = ["src/*/prompts/README.md"]
commit = true
trailer = "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
commit_env = { SKIP_SECRET_SCAN = "1" }   # known false positives in a never-pushed scratch clone
